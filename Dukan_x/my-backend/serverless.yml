# ============================================================================
# BizMate — Serverless Framework Configuration
# ============================================================================
# Multi-Tenant SaaS Backend for 14 Business Types
# AWS Free Tier Compliant: Lambda + API Gateway + RDS + Cognito + S3
# ============================================================================

service: my-backend

frameworkVersion: '4'

# ============================================================================
# PROVIDER
# ============================================================================
provider:
  name: aws
  runtime: nodejs24.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  memorySize: 128          # Minimum — keeps Free Tier usage low
  timeout: 10              # 10s — plenty for API calls
  logRetentionInDays: 14   # Keep costs low

  # ── API Gateway (HTTP API — cheaper than REST API) ──────────────────────
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Tenant-Id

  # ── Environment Variables ───────────────────────────────────────────────
  environment:
    NODE_ENV: ${self:provider.stage}
    DB_HOST: ${env:DB_HOST, 'localhost'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_NAME: ${env:DB_NAME, 'bizmate'}
    DB_USER: ${env:DB_USER, 'bizmate_admin'}
    DB_PASSWORD: ${env:DB_PASSWORD, ''}
    DB_SSL: ${env:DB_SSL, 'false'}
    DB_MAX_CONNECTIONS: ${env:DB_MAX_CONNECTIONS, '5'}
    COGNITO_USER_POOL_ID: !Ref CognitoUserPool
    COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
    COGNITO_DESKTOP_CLIENT_ID: !Ref DesktopAppClient
    COGNITO_MOBILE_CLIENT_ID: !Ref MobileAppClient
    COGNITO_ADMIN_CLIENT_ID: !Ref AdminPanelClient
    # COGNITO_IDENTITY_POOL_ID set after IAM stack deploy (see cf-iam-roles.yml)
    COGNITO_REGION: ${self:provider.region}
    S3_BUCKET_NAME: !Ref TenantStorageBucket
    S3_REGION: ${self:provider.region}
    PLATFORM_APPLICATION_ARN: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:app/GCM/DukanX-Customer-App'
    # ── MobileShop DynamoDB ─────────────────────────────────────────────
    MOBILE_SHOP_TABLE_NAME: ${self:custom.mobileShop.tableName}
    MOBILE_SHOP_CONNECTIONS_TABLE_NAME: ${self:custom.mobileShop.connectionsTableName}
    MOBILE_SHOP_TABLE_ARN: !GetAtt MobileShopTable.Arn

  # ── IAM Permissions ────────────────────────────────────────────────────
  iam:
    role:
      statements:
        # S3 — Tenant storage (invoices, images, reports)
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - !Join ['', ['arn:aws:s3:::', !Ref TenantStorageBucket, '/*']]
        # Cognito — User management
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminUpdateUserAttributes
          Resource:
            - !GetAtt CognitoUserPool.Arn
        # SNS — Push Notifications
        - Effect: Allow
          Action:
            - sns:CreatePlatformEndpoint
            - sns:Publish
            - sns:DeleteEndpoint
          Resource: '*'
        # DynamoDB — MobileShop Application Access
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
          Resource:
            - !GetAtt MobileShopTable.Arn
            - !Join ['', [!GetAtt MobileShopTable.Arn, '/index/*']]
        # DynamoDB — MobileShop Connections Table Access
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt MobileShopConnectionsTable.Arn
            - !Join ['', [!GetAtt MobileShopConnectionsTable.Arn, '/index/*']]
        # DynamoDB Streams — MobileShop Stream Consumer
        - Effect: Allow
          Action:
            - dynamodb:GetRecords
            - dynamodb:GetShardIterator
            - dynamodb:DescribeStream
            - dynamodb:ListStreams
          Resource:
            - !GetAtt MobileShopTable.StreamArn
        # SQS — MobileShop DLQ Access
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt MobileShopStreamDLQ.Arn

# ============================================================================
# CUSTOM
# ============================================================================
custom:
  # ── MobileShop DynamoDB Configuration ────────────────────────────────────
  mobileShop:
    tableName: ${self:service}-${sls:stage}-mobile-shop
    connectionsTableName: ${self:service}-${sls:stage}-mobile-shop-connections
  # ── Deletion Protection per Stage ────────────────────────────────────────
  deletionProtection:
    prod: true
    dev: false
    staging: false

# ============================================================================
# FUNCTIONS (Lambda Handlers)
# ============================================================================
functions:

  # ── Authentication ──────────────────────────────────────────────────────
  authSignup:
    handler: dist/handlers/auth.signup
    events:
      - httpApi:
          path: /auth/signup
          method: POST
    description: Register new tenant + owner account

  authLogin:
    handler: dist/handlers/auth.login
    events:
      - httpApi:
          path: /auth/login
          method: POST
    description: Authenticate user, return Cognito tokens

  authRefresh:
    handler: dist/handlers/auth.refresh
    events:
      - httpApi:
          path: /auth/refresh
          method: POST
    description: Refresh expired access tokens

  # ── Dashboard (Business-Type Aware) ────────────────────────────────────
  getDashboard:
    handler: dist/handlers/dashboard.getDashboard
    events:
      - httpApi:
          path: /dashboard
          method: GET
    description: Returns business-type-specific dashboard data

  # ── Inventory CRUD ─────────────────────────────────────────────────────
  getInventory:
    handler: dist/handlers/inventory.getItems
    events:
      - httpApi:
          path: /inventory
          method: GET

  createInventoryItem:
    handler: dist/handlers/inventory.createItem
    events:
      - httpApi:
          path: /inventory
          method: POST

  updateInventoryItem:
    handler: dist/handlers/inventory.updateItem
    events:
      - httpApi:
          path: /inventory/{id}
          method: PUT

  deleteInventoryItem:
    handler: dist/handlers/inventory.deleteItem
    events:
      - httpApi:
          path: /inventory/{id}
          method: DELETE

  # ── Payments (Hybrid Architecture) ─────────────────────────────────────
  initiatePayment:
    handler: dist/handlers/payment.initiatePayment
    events:
      - httpApi:
          path: /payment/initiate
          method: POST
    environment:
      FIREBASE_DB_URL: ${env:FIREBASE_DB_URL}
      FIREBASE_SERVICE_ACCOUNT: ${env:FIREBASE_SERVICE_ACCOUNT}

  paymentWebhook:
    handler: dist/handlers/payment.paymentWebhook
    events:
      - httpApi:
          path: /payment/webhook
          method: POST
    environment:
      FIREBASE_DB_URL: ${env:FIREBASE_DB_URL}
      FIREBASE_SERVICE_ACCOUNT: ${env:FIREBASE_SERVICE_ACCOUNT}


  # ── Storage (Signed URLs) ──────────────────────────────────────────────
  getSignedUrl:
    handler: dist/handlers/storage.getSignedUrl
    events:
      - httpApi:
          path: /storage/signed-url
          method: GET
    description: Generate pre-signed S3 URL for upload/download

  # ── Notifications ──────────────────────────────────────────────────────
  registerDevice:
    handler: dist/handlers/notification.registerDevice
    events:
      - httpApi:
          path: /notifications/register-device
          method: POST
    description: Register device FCM token for push notifications

  # ── Vendor-Customer Linking (QR Handshake) ──────────────────────────
  linkingGenerateToken:
    handler: dist/handlers/linking.generateToken
    events:
      - httpApi:
          path: /linking/generate-token
          method: POST

  linkingLink:
    handler: dist/handlers/linking.link
    events:
      - httpApi:
          path: /linking/link
          method: POST

  linkingMyVendors:
    handler: dist/handlers/linking.myVendors
    events:
      - httpApi:
          path: /linking/my-vendors
          method: GET

  linkingMyCustomers:
    handler: dist/handlers/linking.myCustomers
    events:
      - httpApi:
          path: /linking/my-customers
          method: GET

  linkingRevoke:
    handler: dist/handlers/linking.revokeLink
    events:
      - httpApi:
          path: /linking/{userId}
          method: DELETE

  # ── Invoices ─────────────────────────────────────────────────────────
  createInvoice:
    handler: dist/handlers/invoices.createInvoice
    events:
      - httpApi:
          path: /invoices
          method: POST

  finalizeInvoice:
    handler: dist/handlers/invoices.finalizeInvoice
    events:
      - httpApi:
          path: /invoices/{id}/finalize
          method: POST

  # ── Stock Management ─────────────────────────────────────────────────
  stockLookupBarcode:
    handler: dist/handlers/stock.lookupBarcode
    events:
      - httpApi:
          path: /stock/lookup-barcode
          method: POST

  stockAnalyzeImage:
    handler: dist/handlers/stock.analyzeImage
    events:
      - httpApi:
          path: /stock/analyze-image
          method: POST

  stockAdd:
    handler: dist/handlers/stock.addStock
    events:
      - httpApi:
          path: /stock/add
          method: POST

  # ── Offline Sync (Push/Pull) ─────────────────────────────────────────
  syncPush:
    handler: dist/handlers/sync.pushChanges
    events:
      - httpApi:
          path: /sync/push
          method: POST
    timeout: 30

  syncPull:
    handler: dist/handlers/sync.pullChanges
    events:
      - httpApi:
          path: /sync/pull
          method: POST
    timeout: 30

  # ── AI Insights ──────────────────────────────────────────────────────
  aiInsight:
    handler: dist/handlers/insights.aiInsight
    events:
      - httpApi:
          path: /insights/ai-insight
          method: POST

  # ── Invoices — Extended ─────────────────────────────────────────────
  voidInvoice:
    handler: dist/handlers/invoices.voidInvoice
    events:
      - httpApi:
          path: /invoices/{id}/void
          method: POST

  sendInvoice:
    handler: dist/handlers/invoices.sendInvoice
    events:
      - httpApi:
          path: /invoices/{id}/send
          method: POST

  # ── Payments ─────────────────────────────────────────────────────────
  listPayments:
    handler: dist/handlers/payments.listPayments
    events:
      - httpApi:
          path: /payments
          method: GET

  getPayment:
    handler: dist/handlers/payments.getPayment
    events:
      - httpApi:
          path: /payments/{id}
          method: GET

  recordPayment:
    handler: dist/handlers/payments.recordPayment
    events:
      - httpApi:
          path: /payments
          method: POST

  # ── Customers ────────────────────────────────────────────────────────
  listCustomers:
    handler: dist/handlers/customers.listCustomers
    events:
      - httpApi:
          path: /customers
          method: GET

  getCustomerLedger:
    handler: dist/handlers/customers.getCustomerLedger
    events:
      - httpApi:
          path: /customers/{id}/ledger
          method: GET

  # ── Products ─────────────────────────────────────────────────────────
  listProducts:
    handler: dist/handlers/products.listProducts
    events:
      - httpApi:
          path: /products
          method: GET

  # ── Reports ──────────────────────────────────────────────────────────
  salesReport:
    handler: dist/handlers/reports.salesReport
    events:
      - httpApi:
          path: /reports/sales
          method: GET
    timeout: 30

  gstr1Report:
    handler: dist/handlers/reports.gstr1Report
    events:
      - httpApi:
          path: /reports/gstr1
          method: GET
    timeout: 30

  # ── Admin ────────────────────────────────────────────────────────────
  killSwitch:
    handler: dist/handlers/admin.killSwitch
    events:
      - httpApi:
          path: /admin/kill-switch
          method: POST

  systemStatus:
    handler: dist/handlers/admin.systemStatus
    events:
      - httpApi:
          path: /admin/status
          method: GET

# ============================================================================
# RESOURCES (CloudFormation)
# ============================================================================
resources:
  Resources:

    # ══════════════════════════════════════════════════════════════════════
    # COGNITO USER POOL
    # ══════════════════════════════════════════════════════════════════════
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      DeletionPolicy: Retain
      Properties:
        UserPoolName: bizmate-users-${self:provider.stage}
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        MfaConfiguration: OPTIONAL
        EnabledMfas:
          - SOFTWARE_TOKEN_MFA
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
            TemporaryPasswordValidityDays: 7
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: true
            Required: true
          - Name: phone_number
            AttributeDataType: String
            Mutable: true
            Required: false
          # ── Custom Attributes for Multi-Tenancy ──
          - Name: tenant_id
            AttributeDataType: String
            Mutable: true
          - Name: role
            AttributeDataType: String
            Mutable: true
            # Values: owner, admin, manager, accountant, cashier, staff, customer
          - Name: business_type
            AttributeDataType: String
            Mutable: true
          - Name: license_status
            AttributeDataType: String
            Mutable: true
            # Values: active, expired, suspended, trial
          - Name: firebase_uid
            AttributeDataType: String
            Mutable: true
            # Preserves original Firebase UID for migration mapping
        UserPoolAddOns:
          AdvancedSecurityMode: OFF
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT

    # ══════════════════════════════════════════════════════════════════════
    # USER GROUPS — Role-Based Access Control
    # ══════════════════════════════════════════════════════════════════════
    GroupSuperAdmin:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: SuperAdmin
        UserPoolId: !Ref CognitoUserPool
        Description: Platform super-administrators (you)
        Precedence: 0

    GroupBusinessOwner:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: BusinessOwner
        UserPoolId: !Ref CognitoUserPool
        Description: Business owners who manage their own tenant
        Precedence: 10

    GroupStaff:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: Staff
        UserPoolId: !Ref CognitoUserPool
        Description: Staff members (manager, cashier, accountant, etc.)
        Precedence: 20

    GroupCustomer:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: Customer
        UserPoolId: !Ref CognitoUserPool
        Description: End customers using the Customer Dashboard app
        Precedence: 30

    # ══════════════════════════════════════════════════════════════════════
    # APP CLIENTS — Separate per platform
    # ══════════════════════════════════════════════════════════════════════

    # Desktop App Client (Electron/Flutter — public client, no secret)
    DesktopAppClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: bizmate-desktop-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days
        AccessTokenValidity: 1          # 1 hour
        IdTokenValidity: 1              # 1 hour
        RefreshTokenValidity: 90        # 90 days (desktop needs longer offline)
        ReadAttributes:
          - email
          - phone_number
          - custom:tenant_id
          - custom:role
          - custom:business_type
          - custom:license_status
          - custom:firebase_uid
        WriteAttributes:
          - email
          - phone_number

    # Mobile App Client (React Native / Flutter — public client, no secret)
    MobileAppClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: bizmate-mobile-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days
        AccessTokenValidity: 1          # 1 hour
        IdTokenValidity: 1              # 1 hour
        RefreshTokenValidity: 30        # 30 days
        ReadAttributes:
          - email
          - phone_number
          - custom:tenant_id
          - custom:role
          - custom:business_type
          - custom:license_status
          - custom:firebase_uid
        WriteAttributes:
          - email
          - phone_number

    # Admin Panel Client (Next.js web — confidential client with secret)
    AdminPanelClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: bizmate-admin-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: true
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days
        AccessTokenValidity: 30         # 30 minutes (tighter for admin)
        IdTokenValidity: 30             # 30 minutes
        RefreshTokenValidity: 7         # 7 days
        ReadAttributes:
          - email
          - phone_number
          - custom:tenant_id
          - custom:role
          - custom:business_type
          - custom:license_status
          - custom:firebase_uid
        WriteAttributes:
          - email

    # Legacy combined client (kept for backward compat during migration)
    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: bizmate-app-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days
        AccessTokenValidity: 1
        IdTokenValidity: 1
        RefreshTokenValidity: 30
        ReadAttributes:
          - email
          - custom:tenant_id
          - custom:role
          - custom:business_type
        WriteAttributes:
          - email

    # ══════════════════════════════════════════════════════════════════════
    # COGNITO IDENTITY POOL + IAM ROLES
    # Moved to cf-iam-roles.yml (deployed separately via aws cloudformation)
    # Reason: SLS v4 cannot resolve ${cognito-identity.amazonaws.com:sub}
    # ══════════════════════════════════════════════════════════════════════
    # CognitoIdentityPool:
    #   See cf-iam-roles.yml for Identity Pool + IAM roles

    # IdentityPoolRoleAttachment:
    #   See cf-iam-roles.yml

    # ══════════════════════════════════════════════════════════════════════
    # S3 BUCKET (Tenant Storage)
    # ══════════════════════════════════════════════════════════════════════
    TenantStorageBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: bizmate-storage-${self:provider.stage}-${aws:accountId}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT]
              AllowedOrigins: ['*']
              MaxAge: 3600
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: ArchiveOldReports
              Prefix: tenants/
              Status: Enabled
              Transitions:
                - StorageClass: GLACIER
                  TransitionInDays: 90

    # ══════════════════════════════════════════════════════════════════════
    # MOBILE SHOP — DynamoDB Table (Single-Table Design)
    # ══════════════════════════════════════════════════════════════════════
    MobileShopTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:custom.mobileShop.tableName}
        BillingMode: PAY_PER_REQUEST
        # ── Primary Key ──────────────────────────────────────────────────
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        # ── Global Secondary Indexes ─────────────────────────────────────
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        # ── DynamoDB Streams ─────────────────────────────────────────────
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        # ── Point-in-Time Recovery ───────────────────────────────────────
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        # ── Server-Side Encryption ───────────────────────────────────────
        SSESpecification:
          SSEEnabled: true
          SSEType: KMS
        # ── Time-to-Live ─────────────────────────────────────────────────
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        # ── Deletion Protection ──────────────────────────────────────────
        DeletionProtectionEnabled: ${self:custom.deletionProtection.${sls:stage}, false}
        # ── Tags ─────────────────────────────────────────────────────────
        Tags:
          - Key: stage
            Value: ${sls:stage}
          - Key: service
            Value: ${self:service}
          - Key: module
            Value: mobile-shop

    # ══════════════════════════════════════════════════════════════════════
    # MOBILE SHOP — WebSocket Connections Table
    # ══════════════════════════════════════════════════════════════════════
    MobileShopConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.mobileShop.connectionsTableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: TenantIndex
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        SSESpecification:
          SSEEnabled: true
        Tags:
          - Key: stage
            Value: ${sls:stage}
          - Key: service
            Value: ${self:service}
          - Key: module
            Value: mobile-shop

    # ══════════════════════════════════════════════════════════════════════
    # MOBILE SHOP — Stream Processing DLQ (SQS)
    # ══════════════════════════════════════════════════════════════════════
    MobileShopStreamDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-mobile-shop-stream-dlq
        MessageRetentionPeriod: 1209600  # 14 days
        VisibilityTimeout: 300
        Tags:
          - Key: stage
            Value: ${sls:stage}
          - Key: service
            Value: ${self:service}
          - Key: module
            Value: mobile-shop

    # ══════════════════════════════════════════════════════════════════════
    # MOBILE SHOP — EventBridge Pipe (DynamoDB Streams → Processing)
    # ══════════════════════════════════════════════════════════════════════
    MobileShopStreamPipeRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-mobile-shop-pipe-role
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: pipes.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: MobileShopPipeSourcePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:DescribeStream
                    - dynamodb:GetRecords
                    - dynamodb:GetShardIterator
                    - dynamodb:ListStreams
                  Resource:
                    - !GetAtt MobileShopTable.StreamArn
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - !GetAtt MobileShopStreamDLQ.Arn

    MobileShopStreamPipe:
      Type: AWS::Pipes::Pipe
      Properties:
        Name: ${self:service}-${sls:stage}-mobile-shop-stream-pipe
        RoleArn: !GetAtt MobileShopStreamPipeRole.Arn
        Source: !GetAtt MobileShopTable.StreamArn
        SourceParameters:
          DynamoDBStreamParameters:
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            MaximumRetryAttempts: 3
            DeadLetterConfig:
              Arn: !GetAtt MobileShopStreamDLQ.Arn
        # Target can be extended to EventBridge bus or Lambda in later tasks
        Target: !GetAtt MobileShopStreamDLQ.Arn
        TargetParameters:
          SqsQueueParameters: {}
        Tags:
          stage: ${sls:stage}
          service: ${self:service}
          module: mobile-shop

    # ══════════════════════════════════════════════════════════════════════
    # MOBILE SHOP — Migration Role (Broader Scoped Access)
    # ══════════════════════════════════════════════════════════════════════
    MobileShopMigrationRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-mobile-shop-migration-role
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: MobileShopMigrationPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                    - dynamodb:GetItem
                    - dynamodb:Query
                    - dynamodb:Scan
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                    - dynamodb:BatchWriteItem
                    - dynamodb:BatchGetItem
                    - dynamodb:TransactWriteItems
                    - dynamodb:TransactGetItems
                    - dynamodb:DescribeTable
                  Resource:
                    - !GetAtt MobileShopTable.Arn
                    - !Join ['', [!GetAtt MobileShopTable.Arn, '/index/*']]
                - Effect: Allow
                  Action:
                    - dynamodb:DescribeStream
                    - dynamodb:GetRecords
                    - dynamodb:GetShardIterator
                    - dynamodb:ListStreams
                  Resource:
                    - !GetAtt MobileShopTable.StreamArn

    # ══════════════════════════════════════════════════════════════════════
    # MOBILE SHOP — CloudWatch Alarms
    # ══════════════════════════════════════════════════════════════════════
    MobileShopDLQAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-mobile-shop-dlq-messages
        AlarmDescription: MobileShop stream DLQ has messages — processing failures detected
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt MobileShopStreamDLQ.QueueName
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        Tags:
          - Key: stage
            Value: ${sls:stage}
          - Key: module
            Value: mobile-shop

    MobileShopTableThrottleAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-mobile-shop-table-throttle
        AlarmDescription: MobileShop DynamoDB table is being throttled
        Namespace: AWS/DynamoDB
        MetricName: ThrottledRequests
        Dimensions:
          - Name: TableName
            Value: ${self:custom.mobileShop.tableName}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        Tags:
          - Key: stage
            Value: ${sls:stage}
          - Key: module
            Value: mobile-shop

    MobileShopGSI1ThrottleAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-mobile-shop-gsi1-throttle
        AlarmDescription: MobileShop GSI1 index is being throttled
        Namespace: AWS/DynamoDB
        MetricName: ThrottledRequests
        Dimensions:
          - Name: TableName
            Value: ${self:custom.mobileShop.tableName}
          - Name: GlobalSecondaryIndexName
            Value: GSI1
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        Tags:
          - Key: stage
            Value: ${sls:stage}
          - Key: module
            Value: mobile-shop

    MobileShopGSI2ThrottleAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-mobile-shop-gsi2-throttle
        AlarmDescription: MobileShop GSI2 index is being throttled
        Namespace: AWS/DynamoDB
        MetricName: ThrottledRequests
        Dimensions:
          - Name: TableName
            Value: ${self:custom.mobileShop.tableName}
          - Name: GlobalSecondaryIndexName
            Value: GSI2
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        Tags:
          - Key: stage
            Value: ${sls:stage}
          - Key: module
            Value: mobile-shop

  # ══════════════════════════════════════════════════════════════════════
  # OUTPUTS
  # ══════════════════════════════════════════════════════════════════════
  Outputs:
    CognitoUserPoolId:
      Value: !Ref CognitoUserPool
      Description: Cognito User Pool ID

    CognitoUserPoolArn:
      Value: !GetAtt CognitoUserPool.Arn
      Description: Cognito User Pool ARN

    # Legacy client (backward compat)
    CognitoUserPoolClientId:
      Value: !Ref CognitoUserPoolClient
      Description: Legacy Cognito App Client ID

    # Per-platform clients
    DesktopAppClientId:
      Value: !Ref DesktopAppClient
      Description: Desktop App Cognito Client ID

    MobileAppClientId:
      Value: !Ref MobileAppClient
      Description: Mobile App Cognito Client ID

    AdminPanelClientId:
      Value: !Ref AdminPanelClient
      Description: Admin Panel Cognito Client ID

    # IdentityPoolId: deployed separately via cf-iam-roles.yml

    S3BucketName:
      Value: !Ref TenantStorageBucket
      Description: Tenant storage bucket name

    ApiEndpoint:
      Value: !GetAtt HttpApi.ApiEndpoint
      Description: HTTP API Gateway endpoint URL

    # ── MobileShop Outputs ─────────────────────────────────────────────────
    MobileShopTableName:
      Value: !Ref MobileShopTable
      Description: MobileShop DynamoDB table name

    MobileShopTableArn:
      Value: !GetAtt MobileShopTable.Arn
      Description: MobileShop DynamoDB table ARN

    MobileShopTableStreamArn:
      Value: !GetAtt MobileShopTable.StreamArn
      Description: MobileShop DynamoDB Streams ARN

    MobileShopConnectionsTableName:
      Value: !Ref MobileShopConnectionsTable
      Description: MobileShop WebSocket connections table name

    MobileShopStreamDLQUrl:
      Value: !Ref MobileShopStreamDLQ
      Description: MobileShop stream processing DLQ URL

    MobileShopStreamDLQArn:
      Value: !GetAtt MobileShopStreamDLQ.Arn
      Description: MobileShop stream processing DLQ ARN

    MobileShopMigrationRoleArn:
      Value: !GetAtt MobileShopMigrationRole.Arn
      Description: MobileShop migration/backfill IAM role ARN

# ============================================================================
# PLUGINS
# ============================================================================
plugins:
  - serverless-offline       # Local development
